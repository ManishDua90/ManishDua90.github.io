
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yellowbird</title>
    <meta name="description" content="Yellowbird publishes app information and legal pages." />
    <style>
      :root {
        --text: #1c1917;
        --muted: #57534e;
        --line: #e7e5e4;
        --bg: #fafaf9;
        --accent: #2f5d50;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        line-height: 1.6;
      }
      main {
        flex: 1;
        width: 100%;
        max-width: 40rem;
        margin: 0 auto;
        padding: 3.5rem 1.25rem 2.5rem;
      }
      h1 {
        font-size: 2.25rem;
        line-height: 1.15;
        margin: 0 0 0.75rem;
      }
      p { margin: 0 0 1.5rem; }
      .muted { color: var(--muted); }
      a {
        color: var(--accent);
        font-weight: 600;
      }
      footer {
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.9rem;
        padding: 1.25rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Yellowbird</h1>
      <p class="muted">
        This site hosts information and legal pages for apps published by Yellowbird.
      </p>
      <p><a href="/store/privacy-policy.html">KEEPly Privacy Policy</a></p>
    </main>
    <footer>© Yellowbird </footer>
  </body>
</html>
